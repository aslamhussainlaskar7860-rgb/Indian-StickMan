<style>
:root{--sf:#ff9933;--gold:#ffd24a;--gr:#1fa84a;--navy:#0b1226;--panel:rgba(12,18,40,.88);--panel2:rgba(24,34,70,.9);--line:rgba(255,255,255,.12);--txt:#eef3ff;--dim:#8fa0c8;--red:#ff4a4a;--blue:#4fb0ff;--hud:"Arial Black","Impact","Trebuchet MS",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#070a14;color:var(--txt);font-family:"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
canvas{display:block}
.screen{position:fixed;inset:0;display:none}.screen.on{display:block}
h2,h3{margin:0}h3{font-family:var(--hud);font-size:14px;letter-spacing:1.5px;color:var(--gold);margin:16px 0 8px}
small{color:var(--dim)}
/* currency icons */
.ic{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:900;vertical-align:middle;margin:0 2px;flex:none;font-family:var(--hud)}

body.hudEdit #pauseMenu{display:none!important}

#hudBar{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;width:min(400px,60vw);padding:10px 14px;background:rgba(8,12,26,.92);border:2px solid var(--line);border-top:3px solid #ffd24a;border-radius:12px;font-family:var(--hud);color:#fff;font-size:12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#hudBar .hb-t{letter-spacing:2px;font-size:13px;color:#ffd24a;text-align:center}#hudBar .hb-t span{font-size:10px;color:#9fb0cc;letter-spacing:.5px}
#hudBar .hb-r{display:flex;align-items:center;gap:6px}#hudBar .hb-l{width:58px;color:#9fb0cc;flex:none}
#hudBar input[type=range]{flex:1;min-width:0}
#hudBar button{background:#1b2540;border:1px solid #3a4a72;color:#fff;border-radius:7px;padding:5px 10px;font:inherit;cursor:pointer;min-width:30px}#hudBar button.on{background:#ffd24a;color:#201400;border-color:#ffd24a}
#hudBar .hb-go{justify-content:center;gap:8px;margin-top:2px}#hudBar .hb-go button{flex:1;padding:8px}#hudBar button.gold{background:linear-gradient(#ffcf4a,#e08a10);color:#201400;border:0;font-weight:700}#hudBar button.red{background:#5a1a22;border-color:#a33}
@media (max-height:480px){#hudBar{padding:6px 10px;gap:3px;width:min(380px,56vw)}#hudBar .hb-t span{display:none}}

/* cosmetics */
.prof-top{border-radius:12px;padding:10px;margin-bottom:8px;position:relative}
.cos-prev{position:relative;border-radius:12px;overflow:hidden;margin-bottom:8px;height:clamp(76px,22vh,120px);border:2px solid var(--line)}.cos-prev .cp-bn,.cos-prev canvas{width:100%;height:100%;display:block}.cos-prev .cp-bn{position:absolute;inset:0}
.cp-av{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:clamp(56px,16vh,84px);height:clamp(56px,16vh,84px)}
.cp-nm{position:absolute;left:calc(clamp(56px,16vh,84px) + 28px);top:50%;transform:translateY(-50%);text-shadow:0 2px 4px #000;display:flex;flex-direction:column}.cp-nm b{font-family:var(--hud);font-size:16px}.cp-nm small{color:var(--gold)}
.chargrid.bn{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.bn-c{width:100%;aspect-ratio:240/70;border-radius:8px;display:block}
.charc.cos{position:relative}.cos-av{width:64px;height:64px;margin:6px auto}
.charc.r-rare{border-color:#4aa8ff}.charc.r-epic{border-color:#c06aff}.charc.r-legend{border-color:#ffc531;box-shadow:0 0 14px rgba(255,197,49,.35)}
.premtag{position:absolute;top:6px;left:6px;z-index:2;font-size:9px;font-weight:700;letter-spacing:1px;color:#2a1800;background:linear-gradient(90deg,#ffe38a,#ffb020,#ffe38a);background-size:200% 100%;animation:shine 2.2s linear infinite;padding:2px 6px;border-radius:5px}
@keyframes shine{from{background-position:0 0}to{background-position:200% 0}}
.btn.gold{background:linear-gradient(#ffcf4a,#e08a10);color:#201400}
.abl{display:block;font-style:normal;font-size:11px;color:#ffd24a;margin:4px 0;line-height:1.25}.abl small{color:#aeb9d0;font-size:10px}
.charc.cos .cos-av canvas{width:100%!important;height:100%!important}.charc.cos canvas.bn-c{width:100%!important;height:auto!important;max-height:none!important;aspect-ratio:240/70}.cos-prev canvas{object-fit:cover}

/* story */
.st-head{text-align:center;font-family:var(--hud);margin-bottom:8px}.st-head b{color:#ffd24a;font-size:20px}.st-head small{color:#9fb0cc}
.st-ch{margin:8px 0;padding:8px;border-left:4px solid var(--cc);background:rgba(255,255,255,.03);border-radius:8px}.st-cht{font-size:13px;color:var(--cc);margin-bottom:6px;letter-spacing:1px}
.st-row{display:flex;gap:8px;flex-wrap:wrap}
.st-node{position:relative;flex:1 1 150px;min-width:140px;background:#141c36;border:2px solid #34416a;border-radius:10px;padding:8px 8px 8px 44px;text-align:left;color:#fff;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.st-node.boss{border-color:#ff4a4a;background:linear-gradient(135deg,#2a1020,#141c36)}.st-node.lock{opacity:.45;cursor:default}.st-node.done{border-color:#ffd24a}
.st-n{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--cc,#555);display:flex;align-items:center;justify-content:center;font-weight:700;color:#111}
.st-node b{font-size:12px}.st-node small{font-size:10px;color:#9fb0cc}.st-stars em{font-style:normal;color:#444;font-size:13px}.st-stars em.on{color:#ffd24a}
.mbox.dlg{max-width:min(620px,92vw)}.dlg-box{min-height:110px;padding:6px 4px;cursor:pointer}.dlg-who{font-family:var(--hud);font-size:18px;letter-spacing:1px;margin-bottom:6px}.dlg-txt{font-size:16px;line-height:1.45;min-height:48px}.dlg-hint{display:block;text-align:right;color:#9fb0cc;margin-top:8px;animation:pulse 1s infinite alternate}
.res-stars{text-align:center;font-size:30px}.res-stars em{font-style:normal;color:#333;margin:0 3px}.res-stars em.on{color:#ffd24a;text-shadow:0 0 12px #ffb000}.res-stars small{display:block;font-size:11px;color:#7dffa6}
.tierc .tx{display:block;font-style:normal;font-size:10px;color:#ffd24a}
.dlg-hint{animation:none!important;opacity:.8;padding-right:8px}

</style>

function copyPose(p) { const o = {}; for (const k of POSE_KEYS) o[k] = p[k]; return o; }
function lerpPoseInto(out, a, b, t) { for (const k of POSE_KEYS) out[k] = a[k] + (b[k] - a[k]) * t; return out; }
const _tmpPose = copyPose(BASE_POSE);
function samplePose(keys, t, out) {
  let i = 0; while (i < keys.length - 1 && t >= keys[i + 1][0]) i++;
  const a = keys[i], b = keys[Math.min(i + 1, keys.length - 1)];
  const pa = typeof a[1] === 'string' ? PO[a[1]] : a[1], pb = typeof b[1] === 'string' ? PO[b[1]] : b[1];
  let k = b[0] > a[0] ? clamp((t - a[0]) / (b[0] - a[0]), 0, 1) : 1;
  return lerpPoseInto(out, pa, pb, smooth(k));
}
function walkPose(ph, back, out) {
  const s = Math.sin(ph), c = Math.cos(ph), amp = back ? 20 : 27;
  const p = P({ lean: back ? 8 : 12, fh: 28 + amp * s, fk: -(16 + 38 * Math.max(0, c)), bh: -20 - amp * s, bk: -(16 + 38 * Math.max(0, -c)), fs: 115 + 7 * c, fe: 78, bs: 100 - 7 * c, be: 96 });
  for (const k of POSE_KEYS) out[k] = p[k]; return out;
}

/* ---------- skeleton ---------- */
function legDepth(h, k) { return Math.cos(h * D2R) * RIG.thigh + Math.cos((h + k) * D2R) * RIG.shin; }
function plantKnee(h, target) {
  const c = (target - Math.cos(h * D2R) * RIG.thigh) / RIG.shin;
  if (c >= 1) return 0; if (c < -1) return -170;
  const s = -Math.acos(c) / D2R; const k = s - h;
  return k > 0 ? 0 : k;
}
function skeleton(p, sc) {
  const R = RIG, J = {};
  let fk = p.fk, bk = p.bk;
  if (p.pl > 0.5) {
    const dF = legDepth(p.fh, fk), dB = legDepth(p.bh, bk), tgt = Math.max(dF, dB);
    if (dF < tgt - 0.5) fk = plantKnee(p.fh, tgt); else if (dB < tgt - 0.5) bk = plantKnee(p.bh, tgt);
  }
  const lean = p.lean * D2R, tx = Math.sin(lean), ty = -Math.cos(lean);
  J.hip = { x: 0, y: 0 };
  J.sh = { x: tx * R.torso * 0.9, y: ty * R.torso * 0.9 };
  J.neck = { x: tx * R.torso, y: ty * R.torso };
  const ha = lean + p.hd * D2R; J.ha = ha;
  J.head = { x: J.neck.x + Math.sin(ha) * (R.head + 5), y: J.neck.y - Math.cos(ha) * (R.head + 5) };
  const arm = (s, e) => { const a = s * D2R, b = (s + e) * D2R; const el = { x: J.sh.x + Math.sin(a) * R.upper, y: J.sh.y + Math.cos(a) * R.upper }; const wr = { x: el.x + Math.sin(b) * R.fore, y: el.y + Math.cos(b) * R.fore }; return [el, wr, b]; };
  [J.fel, J.fwr, J.fa] = arm(p.fs, p.fe); [J.bel, J.bwr, J.ba] = arm(p.bs, p.be);
  const leg = (h, k) => { const a = h * D2R, b = (h + k) * D2R; const kn = { x: Math.sin(a) * R.thigh, y: Math.cos(a) * R.thigh }; const an = { x: kn.x + Math.sin(b) * R.shin, y: kn.y + Math.cos(b) * R.shin }; const to = { x: an.x + Math.cos(b) * R.foot, y: an.y - Math.sin(b) * R.foot }; return [kn, an, to, b]; };
  [J.fkn, J.fan, J.fto, J.fsa] = leg(p.fh, fk); [J.bkn, J.ban, J.bto, J.bsa] = leg(p.bh, bk);
  const names = ['sh', 'neck', 'head', 'fel', 'fwr', 'bel', 'bwr', 'fkn', 'fan', 'fto', 'bkn', 'ban', 'bto'];
  if (p.rot) { const c = Math.cos(p.rot * D2R), s = Math.sin(p.rot * D2R); for (const n of names) { const q = J[n]; const x = q.x * c - q.y * s, y = q.x * s + q.y * c; q.x = x; q.y = y; } J.ha += p.rot * D2R; J.fa += p.rot * D2R; J.ba += p.rot * D2R; J.fsa += p.rot * D2R; J.bsa += p.rot * D2R; }
  // lowest point (for ground snapping)
  let low = 0;
  const rad = { head: 14, fan: 6, fto: 5, ban: 6, bto: 5, fkn: 9, bkn: 9, fwr: 6, bwr: 6, sh: 15 };
  for (const n in rad) low = Math.max(low, J[n].y + rad[n]);
  low = Math.max(low, 13);
  J.low = low;
  return J;
}

/* ---------- drawing helpers ---------- */
function limb(g, a, b, r1, r2) {
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-3, nx = -dy / d, ny = dx / d;
  g.beginPath();
  g.moveTo(a.x + nx * r1, a.y + ny * r1); g.lineTo(b.x + nx * r2, b.y + ny * r2);
  g.lineTo(b.x - nx * r2, b.y - ny * r2); g.lineTo(a.x - nx * r1, a.y - ny * r1); g.closePath(); g.fill();
  g.beginPath(); g.arc(a.x, a.y, r1, 0, 6.2832); g.fill();
  g.beginPath(); g.arc(b.x, b.y, r2, 0, 6.2832); g.fill();
}
function bodyShapes(g, J, col, colBack, ex) {

  g.beginPath(); g.arc(J.bwr.x, J.bwr.y, 6 + ex, 0, 6.2832); g.fill();
  limb(g, J.hip, J.bkn, 10.5 + ex, 8.3 + ex); limb(g, J.bkn, J.ban, 8.3 + ex, 5.8 + ex); limb(g, J.ban, J.bto, 5.5 + ex, 4 + ex);
  g.fillStyle = col;
  // dhoti cloth between legs
  g.beginPath();
  g.moveTo(J.hip.x - 11 - ex, J.hip.y - 4); g.lineTo(J.hip.x + 11 + ex, J.hip.y - 4);
  g.lineTo(J.fkn.x * 0.85 + 4, J.fkn.y * 0.85 + 6); g.lineTo(J.bkn.x * 0.85 - 4, J.bkn.y * 0.85 + 6); g.closePath(); g.fill();
  limb(g, J.hip, J.sh, 12.5 + ex, 15 + ex); limb(g, J.sh, J.neck, 15 + ex, 6.5 + ex);
  g.beginPath(); g.arc(J.head.x, J.head.y, 14 + ex, 0, 6.2832); g.fill();
  limb(g, J.hip, J.fkn, 10.5 + ex, 8.3 + ex); limb(g, J.fkn, J.fan, 8.3 + ex, 5.8 + ex); limb(g, J.fan, J.fto, 5.5 + ex, 4 + ex);
  limb(g, J.sh, J.fel, 7.2 + ex, 6 + ex); limb(g, J.fel, J.fwr, 6 + ex, 5 + ex);
  g.beginPath(); g.arc(J.fwr.x, J.fwr.y, 6 + ex, 0, 6.2832); g.fill();
}
function drawBlade(g, wr, ang, kind, accent, glow) {
  const dx = Math.sin(ang), dy = Math.cos(ang), nx = -dy, ny = dx;
  const len = kind === 'khanda' ? 104 : kind === 'talwar' ? 94 : 100;
  const curve = kind === 'talwar' ? 16 : kind === 'katana' ? 6 : 0;
  const w = kind === 'khanda' ? 7 : 4.6;
  g.save(); g.lineCap = 'round';
  g.strokeStyle = '#050508'; g.lineWidth = 5.5; g.beginPath(); g.moveTo(wr.x - dx * 13, wr.y - dy * 13); g.lineTo(wr.x + dx * 6, wr.y + dy * 6); g.stroke();
  g.strokeStyle = accent; g.lineWidth = 3; g.beginPath(); g.moveTo(wr.x + dx * 7 + nx * 7, wr.y + dy * 7 + ny * 7); g.lineTo(wr.x + dx * 7 - nx * 7, wr.y + dy * 7 - ny * 7); g.stroke();
  const bx = wr.x + dx * 9, by = wr.y + dy * 9;
  const tipx = bx + dx * len + nx * curve * 0.6, tipy = by + dy * len + ny * curve * 0.6;
  const cx = bx + dx * len * 0.55 + nx * curve * 1.1, cy = by + dy * len * 0.55 + ny * curve * 1.1;
  const path = ex => { g.beginPath(); g.moveTo(bx + nx * (w + ex), by + ny * (w + ex)); g.quadraticCurveTo(cx + nx * (w * 0.7 + ex), cy + ny * (w * 0.7 + ex), tipx, tipy); g.quadraticCurveTo(cx - nx * (w * 0.7 + ex), cy - ny * (w * 0.7 + ex), bx - nx * (w + ex), by - ny * (w + ex)); g.closePath(); };
  if (glow) { g.fillStyle = rgba(accent, 0.35); path(3.5); g.fill(); }
  const gr = g.createLinearGradient(bx - nx * w, by - ny * w, bx + nx * w, by + ny * w);
  gr.addColorStop(0, '#f4f9ff'); gr.addColorStop(0.5, '#aebfd6'); gr.addColorStop(1, '#6f819c');
  g.fillStyle = gr; path(0); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 1; g.beginPath(); g.moveTo(bx + nx * w * 0.4, by + ny * w * 0.4); g.quadraticCurveTo(cx + nx * w * 0.3, cy + ny * w * 0.3, tipx, tipy); g.stroke();
  g.restore();
  return { x: tipx, y: tipy };
}

function ribbon(g, x0, y0, n, seg, t, vloc, vy, col, wid, phase) {
  g.strokeStyle = col; g.lineCap = 'round'; g.lineJoin = 'round';
  g.lineWidth = wid; g.beginPath(); g.moveTo(x0, y0);
  for (let i = 1; i <= n; i++) {
    const x = x0 - i * seg - vloc * 0.018 * i, y = y0 + Math.sin(t * 9 + i * 0.9 + phase) * 1.8 * i * 0.7 + vy * 0.012 * i + i * 0.9;
    g.lineTo(x, y);
  }
  g.stroke();
}

/* ---------- REALISTIC BODY RENDER (v2) ---------- */
const SHADE = (h, t) => t < 0 ? mix(h, '#000000', -t) : mix(h, '#ffffff', t);
function outfitOf(look) {
  const a = look.accent;
  return { skin: look.skin || '#cf9462', top: look.top || SHADE(a, -.62), pants: look.pants || SHADE(a, -.78), boot: look.boot || '#17141a', glove: look.glove || SHADE(a, -.7), hair: look.hair || '#0d0a0c', trim: look.trim || a, bare: look.bare || false };
}
function limbShaded(g, a, b, r1, r2, col, hi, lo) {
  limb(g, a, b, r1, r2);            // caller sets fillStyle (base)
}
function seg(g, a, b, r1, r2, base, dark, light, white) {
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-3, nx = -dy / d, ny = dx / d;
  // outline
  g.fillStyle = white ? '#fff' : '#08060a'; limb(g, a, b, r1 + 1.6, r2 + 1.6);
  g.fillStyle = white ? '#fff' : base; limb(g, a, b, r1, r2);

  g.fillStyle = dark; g.globalAlpha = .38;
  g.beginPath(); g.moveTo(a.x - nx * r1 * .15, a.y - ny * r1 * .15); g.lineTo(b.x - nx * r2 * .15, b.y - ny * r2 * .15); g.lineTo(b.x - nx * r2, b.y - ny * r2); g.lineTo(a.x - nx * r1, a.y - ny * r1); g.closePath(); g.fill();
  g.fillStyle = light; g.globalAlpha = .28;
  g.beginPath(); g.moveTo(a.x + nx * r1 * .35, a.y + ny * r1 * .35); g.lineTo(b.x + nx * r2 * .35, b.y + ny * r2 * .35); g.lineTo(b.x + nx * r2 * .7, b.y + ny * r2 * .7); g.lineTo(a.x + nx * r1 * .7, a.y + ny * r1 * .7); g.closePath(); g.fill();
  g.globalAlpha = 1;
}
function drawArmReal(g, sh, el, wr, O, white, back) {
  const sl = back ? SHADE(O.top, -.25) : O.top, sk = back ? SHADE(O.skin, -.25) : O.skin;
  // upper arm (sleeve or bare skin), forearm skin with glove/wrap, fist
  if (O.bare) seg(g, sh, el, 7.4, 6.2, sk, SHADE(sk, -.5), SHADE(sk, .4), white); else seg(g, sh, el, 7.6, 6.4, sl, SHADE(sl, -.5), SHADE(sl, .35), white);
  seg(g, el, wr, 6.2, 5.2, sk, SHADE(sk, -.5), SHADE(sk, .4), white);
  // wrist wrap
  const t = .62, wx = lerp(el.x, wr.x, t), wy = lerp(el.y, wr.y, t);
  g.fillStyle = white ? '#fff' : (back ? SHADE(O.glove, -.2) : O.glove); limb(g, { x: wx, y: wy }, wr, 5.8, 5.6);
  g.fillStyle = white ? '#fff' : O.trim; g.globalAlpha = back ? .6 : 1; g.fillRect(wx - 5.5, wy - 1, 11, 1.6); g.globalAlpha = 1;
  g.fillStyle = white ? '#fff' : '#08060a'; g.beginPath(); g.arc(wr.x, wr.y, 6.6, 0, 6.2832); g.fill();
  g.fillStyle = white ? '#fff' : (back ? SHADE(O.glove, -.2) : SHADE(O.glove, .12)); g.beginPath(); g.arc(wr.x, wr.y, 5.2, 0, 6.2832); g.fill();

function drawLegReal(g, hip, kn, an, to, O, white, back) {

  g.fillStyle = white ? '#fff' : bt; limb(g, { x: bx, y: by }, an, 6.4, 5.9);

/* full fighter draw. f has: pose, x,y,face,hipH, skin(look), flash, vx,vy, tailT, scale */
function drawFighter(g, f, time, opts = {}) {
  const look = f.look, sc = f.scale || 1;
  const J = skeleton(f.pose, sc);
  const air = f.air || opts.air;
  const off = air ? 97 : J.low;
  f.hipH = f.hipH == null ? off : f.hipH + (off - f.hipH) * (opts.snap ? 1 : Math.min(1, (opts.dt || 0.016) * 30));
  const hx = f.x + (f.shx || 0), hy = f.y - f.hipH * sc;
  const accent = look.accent, accent2 = look.accent2;
  const white = f.flash > 0;
  g.save();
  g.translate(hx, hy); g.scale(f.face * sc, sc);
  const vloc = (f.vx || 0) * f.face, vy = f.vy || 0;
  // rim glow pass
  if (!opts.noGlow) {
    g.globalAlpha = opts.glowAlpha != null ? opts.glowAlpha : 0.4; bodyShapes(g, J, accent, accent, 2.2); g.globalAlpha = 1;
  }
  bodyReal(g, J, f, white, accent);
  const dark = white ? '#fff' : '#030305';
  // sash / belt
  g.strokeStyle = accent; g.lineWidth = 5; g.lineCap = 'round';
  const bx = J.sh.x * 0.08, by = J.sh.y * 0.08 - 1;
  g.beginPath(); g.moveTo(bx - 9, by + 1); g.lineTo(bx + 9, by - 1); g.stroke();
  ribbon(g, bx - 8, by + 2, 4, 6, time, vloc, vy, accent, 3.2, 1.4);
  // sword sheath on back
  if (!f.pose.wp && !f.armed && f.look.weapon) {
    g.strokeStyle = white ? '#fff' : '#3a2616'; g.lineWidth = 3.4;
    const sx = J.sh.x, sy = J.sh.y;
    g.beginPath(); g.moveTo(J.hip.x - 15, J.hip.y + 14); g.lineTo(sx - 4 + (sx - J.hip.x) * 0.05, sy - 4); g.stroke();
    g.strokeStyle = accent; g.lineWidth = 3; g.beginPath(); g.moveTo(sx - 4, sy - 5); g.lineTo(sx - 8 - (sx) * 0.08, sy - 15); g.stroke();
  }
  // headwear
  drawHeadwear(g, J, f, time, vloc, vy, white);
  // weapon
  const armed = f.pose.wp > 0.5 || f.armed;
  let tip = null;
  if (armed) tip = drawBlade(g, J.fwr, J.fa + (f.pose.wa || 0) * D2R, look.weapon, accent, !opts.noGlow);
  g.restore();
  if (armed && tip) { f.tipW = { x: hx + f.face * sc * tip.x, y: hy + sc * tip.y }; } else f.tipW = null;
  f.baseW = armed ? { x: hx + f.face * sc * J.fwr.x, y: hy + sc * J.fwr.y } : null;
  f.headW = { x: hx + f.face * sc * J.head.x, y: hy + sc * J.head.y };
  f.chestW = { x: hx + f.face * sc * J.sh.x * 0.9, y: hy + sc * J.sh.y * 0.9 };
  f.handW = { x: hx + f.face * sc * J.fwr.x, y: hy + sc * J.fwr.y };
  f.handB = { x: hx + f.face * sc * J.bwr.x, y: hy + sc * J.bwr.y };
  f.footW = { x: hx + f.face * sc * J.fto.x, y: hy + sc * J.fto.y };
  return J;
}

/* ---------- pre-rendered character portrait helper (UI) ---------- */
function renderPortrait(canvas, skinKey, poseName, opts = {}) {
  const g = canvas.getContext('2d'); const W = canvas.width, H = canvas.height;
  g.clearRect(0, 0, W, H);
  const look = opts.look || SKINS[skinKey];
  const f = { look, pose: copyPose(PO[poseName || 'idle']), x: 0, y: 0, face: opts.face || 1, scale: 1, vx: 0, vy: 0, flash: 0, armed: opts.armed };
  const s = H / (opts.fit || 240);
  g.save(); g.translate(W / 2 + (opts.dx || 0), H * (opts.base || 0.97)); g.scale(s, s);
  drawFighter(g, f, opts.t || 0, { snap: true, noGlow: opts.noGlow });
  g.restore();
}

/* ---------------- lucky wheel ---------------- */
function drawWheel(rot) {
  const c = $('#wheel'); if (!c) return; const g = c.getContext('2d'), W = c.width, R = W / 2 - 6; g.clearRect(0, 0, W, W); g.save(); g.translate(W / 2, W / 2); g.rotate(rot * D2R);
  const cols = ['#ff9933', '#fff3d6', '#2f9e44', '#ffd23a', '#e0452f', '#ffe8b0', '#138808', '#ffb347'];
  SPIN_PRIZES.forEach((p, i) => { const a0 = (-90 + i * 45) * D2R, a1 = (-90 + (i + 1) * 45) * D2R; g.fillStyle = cols[i]; g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, R, a0, a1); g.closePath(); g.fill(); g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 2; g.stroke(); g.save(); g.rotate((a0 + a1) / 2); g.fillStyle = [1, 3, 5, 7].includes(i) || i === 0 ? '#2a1400' : '#fff'; g.fillStyle = i % 2 ? '#2a1400' : '#fff'; if (i === 1 || i === 5 || i === 3 || i === 7) g.fillStyle = '#2a1400'; g.font = '900 24px Arial Black,sans-serif'; g.textAlign = 'right'; g.textBaseline = 'middle'; const ic = { coins: '₹', gems: '◆', diya: '🪔', pxp: '★' }[p.t]; g.fillText(ic + p.v, R - 18, 0); g.restore(); });
  g.fillStyle = '#2a1030'; g.beginPath(); g.arc(0, 0, 30, 0, 6.283); g.fill(); g.strokeStyle = '#ffd24a'; g.lineWidth = 5; g.stroke(); g.fillStyle = '#ffd24a'; g.font = '900 15px Arial Black'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('GO', 0, 1); g.restore();
  g.strokeStyle = '#ffd24a'; g.lineWidth = 8; g.beginPath(); g.arc(W / 2, W / 2, R, 0, 6.283); g.stroke();
}

function applyResult(res) {
  const S = Store.data, st = res.stats, c = res.cfg, win = res.win; const out = { coins: 0, xp: 0, pxp: 0, diya: 0, gems: 0, rank: null, levelUps: [], tierRewards: [] };
  _levelHook = l => out.levelUps.push(l);
  if (c.mode === 'training') { Store.save(); _levelHook = null; return out; }
  const ss = S.stats; ss.matches++; if (win) ss.wins++; else ss.losses++; ss.punches += st.punches; ss.kicks += st.kicks; ss.specials += st.specials; ss.shurikens += st.shurikens; ss.maxCombo = Math.max(ss.maxCombo, st.maxCombo); ss.damage += st.damage; ss.kills += st.kills; ss.blocks += st.blocks; ss.perfect += st.perfect;
  if (c.mode === 'duel') {
    out.coins = win ? 120 + (c.ranked ? 70 : 0) + (res.perfectRound ? 50 : 0) : 35; out.xp = win ? (c.ranked ? 85 : 60) : 25; out.diya = win ? 3 : 1; if (!c.ranked) { out.coins = Math.round(out.coins * (win ? .8 : 1)); }
    if (c.ranked) {
      const before = rankOf(S.rp); let delta = 0;
      if (win) { delta = Math.round(Math.max(12, 28 - before.tier * 1.2) + Math.min(10, S.rankStreak * 2) + (res.perfectRound ? 3 : 0)); S.rankStreak++; S.rankWins++; } else { delta = before.tier === 0 ? 0 : -Math.round(10 + before.tier * 1.6); S.rankStreak = 0; if (res.quit) delta = before.tier === 0 ? -5 : delta - 5; }
      S.rankMatches++; const oldRp = S.rp; S.rp = Math.max(before.tier * RP_PER_TIER, S.rp + delta); delta = S.rp - oldRp; S.bestRP = Math.max(S.bestRP, S.rp); const after = rankOf(S.rp);
      out.rank = { before, after, delta, beforePct: before.pct, afterPct: after.pct, promoted: after.tier > before.tier || (after.tier === before.tier && after.sub > before.sub), demoted: after.sub < before.sub && after.tier === before.tier };
      S.tierRewarded = S.tierRewarded || 0; while (S.tierRewarded < after.tier) { S.tierRewarded++; const t = S.tierRewarded; const rc = { t: 'coins', v: t * 400 }, rg = { t: 'gems', v: t * 10 }; giveReward(rc); giveReward(rg); out.tierRewards.push(rc, rg); const ex = RANK_EXTRA[t]; if (ex) { giveReward(ex); out.tierRewards.push(ex); } }
      if (after.tier > before.tier) UI.toast(`RANK UP! ${after.name}`, 'gold');
    }
  } else if (c.endless) {
    out.coins = res.wave * 20 + st.kills * 12; out.xp = Math.min(220, res.wave * 10 + st.kills * 2); out.diya = 2; if (res.wave > ss.rushBest) ss.rushBest = res.wave;
  } else {
    const f = .5 + DIFFS[c.diffBase >= .9 ? 'insane' : c.diffBase >= .65 ? 'hard' : c.diffBase >= .4 ? 'normal' : 'easy'];
    out.coins = Math.min(400, Math.round(st.kills * 7 * f)) + (win ? 60 : 0); out.xp = Math.min(90, Math.round(st.kills * 2.5)) + (win ? 20 : 0); out.diya = win ? 1 : 0;
  }
  if (res.quit) { out.coins = 0; out.xp = 0; out.diya = 0; }
  if (c.story) Story.apply(res, out);
  out.pxp = out.xp; const wk = isWeekend(); if (wk) out.pxp *= 2;
  S.coins += out.coins; addXp(out.xp); addPassXp(out.xp); S.events.diya += out.diya;
  // missions + event tasks
  ensureMissions(); ensureEventDay();
  const ma = (k, n, mx) => { if (n > 0) { missionAdd(k, n, mx); eventAdd(k, n, mx); } };
  ma('play', 1); if (win) ma('win', 1); if (c.ranked) ma('ranked', 1); ma('punch', st.punches); ma('kick', st.kicks); ma('throw', st.shurikens); ma('special', st.specials); ma('combo', st.maxCombo, true); ma('kills', st.kills); ma('block', st.blocks); ma('perfect', st.perfect);
  if (c.endless) { ma('wave', res.wave, true); ma('rush', 1); }
  Store.save(); _levelHook = null; return out;
}
